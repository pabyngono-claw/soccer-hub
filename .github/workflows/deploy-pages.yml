name: Deploy to Cloudflare Workers (Static Assets)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Inject environment variables
        run: ./build.sh
        env:
          XANO_BASE_URL: ${{ secrets.XANO_BASE_URL }}
          XANO_API_KEY: ${{ secrets.XANO_API_KEY }}
          MEMBERSTACK_PUBLIC_KEY: ${{ secrets.MEMBERSTACK_PUBLIC_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}

      - name: Create wrangler.toml
        run: |
          cat > wrangler.toml << 'EOF'
          name = "soccer-prediction-hub"
          compatibility_date = "2024-01-01"
          
          [assets]
          directory = "."
          exclude = [".github", ".git", "build.sh", "README.md", "*.md"]
          EOF

      - name: Deploy static assets
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}